name: Build Mihomo iOS arm64 Binary
on:
  push:
    branches: [ Meta ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Go SDK
        uses: actions/setup-go@v5
        with:
          go-version: 1.23

      - name: Tidy modules
        run: go mod tidy -v

      - name: Build iOS arm64 static binary
        run: |
          set -e
          export CGO_ENABLED=0
          export GOOS=ios
          export GOARCH=arm64
          echo "Check entry dir ./cmd/mihomo"
          ls -la ./cmd/mihomo
          go build -v -o mihomo ./cmd/mihomo

      - name: Check binary architecture
        run: lipo -info mihomo

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-ios-arm64
          path: mihomo
